name: PushFox Review
description: BYOK AI PR reviewer — Static Pack → Agentic Investigation → Structured Review
author: PushFox

inputs:
  gemini_api_key:
    description: Gemini API key (BYOK). Prefer secrets.GEMINI_API_KEY.
    required: false
  openrouter_api_key:
    description: OpenRouter API key (BYOK). Prefer secrets.OPENROUTER_API_KEY.
    required: false
  provider:
    description: LLM provider (gemini|openrouter)
    required: false
    default: gemini
  model:
    description: Model name (provider-specific; OpenRouter uses vendor/model ids)
    required: false
    default: gemini-3.6-flash
  max_iterations:
    description: Maximum agent investigation iterations
    required: false
    default: "8"
  severity_threshold:
    description: Minimum severity to report (critical|high|medium|low|info)
    required: false
    default: medium
  publish:
    description: Whether to publish a PR comment
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Install PushFox
      shell: bash
      run: |
        if [ -f package.json ] && grep -q '"name": "pushfox"' package.json; then
          npm ci
          npm run build
        else
          npm install -g github:Anoop810/PushFox || npm install -g "$(pwd)"
        fi

    - name: Resolve PR refs
      id: refs
      shell: bash
      run: |
        echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
        echo "head_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
        echo "pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

    - name: Run review
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter_api_key }}
        GITHUB_TOKEN: ${{ github.token }}
        PUSHFOX_PROVIDER: ${{ inputs.provider }}
        PUSHFOX_MODEL: ${{ inputs.model }}
        PUSHFOX_MAX_ITERATIONS: ${{ inputs.max_iterations }}
        PUSHFOX_SEVERITY_THRESHOLD: ${{ inputs.severity_threshold }}
        PUSHFOX_PUBLISH: ${{ inputs.publish }}
        PUSHFOX_BASE_SHA: ${{ steps.refs.outputs.base_sha }}
        PUSHFOX_HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
        PUSHFOX_PR_NUMBER: ${{ steps.refs.outputs.pr_number }}
        PUSHFOX_PR_TITLE: ${{ github.event.pull_request.title }}
        PUSHFOX_PR_BODY: ${{ github.event.pull_request.body }}
        PUSHFOX_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        PUSHFOX_PR_URL: ${{ github.event.pull_request.html_url }}
        PUSHFOX_REPOSITORY: ${{ github.repository }}
      run: |
        if [ -f dist/github/action.js ]; then
          node dist/github/action.js
        else
          pushfox review --base "$PUSHFOX_BASE_SHA" --head "$PUSHFOX_HEAD_SHA" --markdown
        fi
